<div class="modal-backdrop">
  <div class="modal form-modal">
    <div class="modal-header">
      <h2>{{ isEditMode ? 'Update Client' : 'Create Client' }}</h2>
      <button class="close-button" (click)="onClose()" aria-label="Close">&times;</button>
    </div>

    <div class="modal-body">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div *ngIf="error" class="error-message">
          {{ error }}
        </div>

        <div class="form-group">
          <label for="name">Name *</label>
          <input
            id="name"
            type="text"
            formControlName="name"
            placeholder="Client name"
            [class.error]="form.get('name')?.invalid && form.get('name')?.touched">
          <div class="field-error" *ngIf="form.get('name')?.invalid && form.get('name')?.touched">
            <span *ngIf="form.get('name')?.errors?.['required']">Name is required</span>
            <span *ngIf="form.get('name')?.errors?.['minlength']">Name must have at least 3 characters</span>
            <span *ngIf="form.get('name')?.errors?.['maxlength']">Name must not exceed 100 characters</span>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email *</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="client@example.com"
            [class.error]="form.get('email')?.invalid && form.get('email')?.touched">
          <div class="field-error" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
            <span *ngIf="form.get('email')?.errors?.['required']">Email is required</span>
            <span *ngIf="form.get('email')?.errors?.['email']">Invalid email format</span>
            <span *ngIf="form.get('email')?.errors?.['minlength']">Email must have at least 5 characters</span>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="action-button secondary" (click)="onClose()">
            Cancel
          </button>
          <button type="submit" class="action-button primary" [disabled]="form.invalid || isSubmitting">
            {{ isEditMode ? 'Update' : 'Create' }}
          </button>
        </div>

        <p *ngIf="isSubmitting" class="updating-message">Saving...</p>
      </form>
    </div>
  </div>
</div>
