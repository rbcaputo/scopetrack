<div class="modal-backdrop">
  <div class="modal form-modal">
    <div class="modal-header">
      <h2>Add Contract</h2>
      <button class="close-button" (click)="onClose()" aria-label="Close">&times;</button>
    </div>

    <div class="modal-body">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div *ngIf="error" class="error-message">
          {{ error }}
        </div>

        <div class="form-group">
          <label for="title">Title *</label>
          <input
            id="title"
            type="text"
            formControlName="title"
            placeholder="Contract title"
            [class.error]="form.get('title')?.invalid && form.get('title')?.touched">
          <div class="field-error" *ngIf="form.get('title')?.invalid && form.get('title')?.touched">
            <span *ngIf="form.get('title')?.errors?.['required']">Title is required</span>
            <span *ngIf="form.get('title')?.errors?.['minlength']">Title must have at least 10 characters</span>
            <span *ngIf="form.get('title')?.errors?.['maxlength']">Title must not exceed 200 characters</span>
          </div>
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea
            id="description"
            formControlName="description"
            placeholder="Contract description"
            rows="4"></textarea>
          <div class="field-error" *ngIf="form.get('description')?.invalid && form.get('description')?.touched">
            <span *ngIf="form.get('description')?.errors?.['maxlength']">Description must not exceed 1000 characters</span>
          </div>
        </div>

        <div class="form-group">
          <label for="type">Type *</label>
          <select
            id="type"
            formControlName="type"
            [class.error]="form.get('type')?.invalid && form.get('type')?.touched">
            <option value="">Select type...</option>
            <option value="FixedPrice">Fixed Price</option>
            <option value="TimeBased">Time Based</option>
          </select>
          <div class="field-error" *ngIf="form.get('type')?.invalid && form.get('type')?.touched">
            Type is required
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="action-button secondary" (click)="onClose()">
            Cancel
          </button>
          <button type="submit" class="action-button primary" [disabled]="form.invalid || isSubmitting">
            Add Contract
          </button>
        </div>

        <p *ngIf="isSubmitting" class="updating-message">Saving...</p>
      </form>
    </div>
  </div>
</div>
